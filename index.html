<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
  <h1>TaskFlow</h1>
  <p>Organiza tu día de forma inteligente</p>
</header>

<section class="addTask">
  <input id="taskInput" placeholder="Escribe una tarea...">
  <button id="addBtn">Agregar</button>
</section>

<main class="board">

  <div class="column" data-status="todo">
    <h2>Pendiente <span class="count">0</span></h2>
  </div>

  <div class="column" data-status="doing">
    <h2>En Proceso <span class="count">0</span></h2>
  </div>

  <div class="column" data-status="done">
    <h2>Completado <span class="count">0</span></h2>
  </div>

</main>

<script src="app.js"></script>
</body>
</html>
